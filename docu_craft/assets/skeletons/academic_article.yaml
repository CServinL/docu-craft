meta:
  name: Academic Article
  description: Standard sections for an academic article (Spanish)

sections:
  - heading: Abstract
    required: false
    description: Brief summary, 150-250 words
  - heading: Introducción
    required: true
    description: Background, problem statement, objectives
  - heading: Marco Teórico
    required: false
    description: Literature review and theoretical foundations
  - heading: Metodología
    required: false
    description: Research design, data, tools
  - heading: Resultados
    required: false
    description: Findings without interpretation
  - heading: Discusión
    required: false
    description: Interpretation and comparison with literature
  - heading: Conclusiones
    required: true
    description: Summary of contributions and future work
  - heading: Referencias
    required: false
    description: Bibliography
